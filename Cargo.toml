[package]
name = "vigilia"
version = "0.1.0"
edition = "2024"
description = "GitHub REST 枠を使わず GraphQL で CI 状態を見張り、結果を全セッションで共有するツール"
publish = false

[profile.release]
# 単一バイナリを小さく保つ。
lto = true
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
