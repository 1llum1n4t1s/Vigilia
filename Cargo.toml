[package]
name = "vigilia"
version = "1.0.4"
edition = "2024"
description = "Watch GitHub Actions through GraphQL without spending the REST rate limit, and share the result across sessions."
license = "MIT"
repository = "https://github.com/1llum1n4t1s/Vigilia"
publish = false

[profile.release]
# 単一バイナリを小さく保つ。
lto = true
codegen-units = 1
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
