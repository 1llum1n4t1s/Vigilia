name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Windows x64 が主、macOS は Apple Silicon(macos-latest)。Intel Mac は対象外。
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache Rust build
        # 保存は main だけ（PR は復元のみ）。配信 workflow には入れない。
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Install / publish script tests
        # install.ps1（Windows のみ。Windows PowerShell 5.1 でも実行）・install.sh・Publish-R2.ps1 の入力検査を、
        # ローカルのモック HTTP で確かめる。R2 にも Certum にも接続しない。
        shell: pwsh
        run: ./tests/Test-Install.ps1
